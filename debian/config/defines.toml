[base]
uri = "https://gitlab.com/kernel-firmware/linux-firmware"
# Symlink patterns we want check_upstream.py to ignore
links_excluded = [
  "a300_pfp.fw",
  "a300_pm4.fw",
]

[[package]]
name = "amd-graphics"
desc = "AMD/ATI graphics and NPU chips"
longdesc = "AMD/ATI graphics and NPU chips supported by the radeon, amdgpu, amdxdna and r128 drivers"
support = [
  "initramfs-tools"
]
files = [
  "amdgpu/*",
  "amdnpu/*/*",
  "r128/*",
  "radeon/*",
]

[[package]]
name = "atheros"
desc = "Qualcomm Atheros wireless cards"
longdesc = "USB wireless network and Bluetooth cards supported by the ar5523, ath3k, ath6kl_sdio, ath6kl_usb, ath10k, ath11k, or wilc6210 drivers"
files = [
  "ar5523.bin",
  "ath3k-1.fw",
  "htc_7010.fw",
  "htc_9271.fw",
  "wil6210.*",
  "ar3k/*",
  "ath6k/**",
  "ath10k/**",
  "ath11k/**",
  "ath12k/**",
  "qca/**",
]
files_excluded = [
  "ath10k/**/notice*.txt*",
  "ath11k/**/Notice.txt",
  "ath12k/**/Notice.txt",
]

[[package]]
name = "bnx2"
desc = "Broadcom NetXtremeII"
longdesc = "Broadcom NetXtremeII network adapters supported by the bnx2 driver"
support = [
  "initramfs-tools"
]
files = [
  "bnx2/*",
]

[[package]]
name = "bnx2x"
desc = "Broadcom NetXtreme II 10Gb"
longdesc = "Broadcom NetXtreme II 10Gb network adapters supported by the bnx2x driver"
support = [
  "initramfs-tools"
]
files = [
  "bnx2x/*",
]

[[package]]
name = "brcm80211"
desc = "Broadcom/Cypress 802.11 wireless cards"
longdesc = "wireless network cards supported by the brcmsmac or brcmfmac driver"
files = [
  "brcm/bcm43xx*",
  "brcm/brcmfmac*",
  "cypress/cyfmac*",
]

[[package]]
name = "cavium"
desc = "Cavium Ethernet adapters"
longdesc = "Cavium crypto and Ethernet adapters supported by the nitrox and liquidio drivers"
support = [
  "initramfs-tools"
]
files = [
  "cavium/*",
  "liquidio/*",
]

[[package]]
name = "cirrus"
desc = "Cirrus Logic audio chips"
longdesc = "Cirrus Logic audio chips like smart amplifiers, converters and DSPs"
files = [
  "cirrus/**",
  "cs42l43.bin",
  "sdca/1fa/**",
]

[[package]]
name = "intel-graphics"
desc = "Intel iGPUs and IPUs"
longdesc = "Intel integrated GPUs and IPUs supported by the i915, intel-ipu6-isys, ipu3-imgu, mei-vsc-hw, and xe drivers"
support = [
  "initramfs-tools"
]
conflicts = [
  "firmware-misc-nonfree (<< 20230625-3~)"
]
files = [
  "i915/*",
  "intel/ipu/*",
  "intel/ipu3-fw.bin",
  "intel/irci_*",
  "intel/vsc/*",
  "xe/*",
]

[[package]]
name = "intel-misc"
desc = "miscellaneous Intel devices and chips"
longdesc = "miscellaneous Intel devices and chips, which do not belong in the iwlwifi, ipw2x00, intel-graphics or intel-sound packages. This includes for example Omni-Path, Ethernet/Network chips/devices, and QuickAssist Technology crypto accelerators"
conflicts = [
  "firmware-misc-nonfree (<< 20230625-3~)",
]
files = [
  "hfi1_*",
  "qat_*",
  "e100/*",
  "dell/ish/*",
  "HP/ish/*",
  "intel/ice/**",
  "intel/ish/*",
  "intel/qat/*",
  "intel/vpu/*",
  "LENOVO/ish/*",
]
files_excluded = [
  "qat_4xxx*",
  "intel/qat/qat_4xxx*",
]

[[package]]
name = "intel-sound"
desc = "Intel sound DSPs"
longdesc = "Intel SST sound DSPs supported by the snd-soc-sst-acpi or snd-intel-sst-acpi driver"
files = [
  "intel/dsp_fw_*",
  "intel/fw_sst_*",
  "intel/IntcSST2.bin",
  "intel/avs/**",
  "intel/catpt/bdw/dsp_basefw.bin",
]
files_excluded = [
  "intel/dsp_fw_*_v*.bin",
]

[[package]]
name = "ipw2x00"
desc = "Intel Pro Wireless 2100, 2200 and 2915"
longdesc = "Intel Pro Wireless 2100, 2200 and 2915 cards supported by the ipw2100 and ipw2200 drivers"
license_title = "Intel Pro Wireless 2100 and 2200/2915 License"
# There is no meaningful upstream homepage for this package, which is
# sourced from 2 separate Sourceforge projects.
uri = ""
files = [
  "ipw2100-1.3.fw",
  "ipw2100-1.3-i.fw",
  "ipw2100-1.3-p.fw",
  "ipw2200-bss.fw",
  "ipw2200-ibss.fw",
  "ipw2200-sniffer.fw",
]

[[package]]
name = "ivtv"
desc = "iTVC15-family MPEG codecs (ivtv and pvrusb2 drivers)"
longdesc = "TV cards with Conexant iTVC15-family MPEG codecs, supported by the ivtv and pvrusb2 drivers"
license_title = "Hauppauge End-User Firmware License Agreement"
# ivtvdriver.org is domain-squatted as of July 2018
#uri = "http://dl.ivtvdriver.org/ivtv/firmware/"
uri = "https://web.archive.org/web/20150508162618/http://dl.ivtvdriver.org:80/ivtv/firmware/"
files = [
  "v4l-cx2341x-dec.fw",
  "v4l-cx2341x-enc.fw",
  "v4l-cx2341x-init.mpg",
  "v4l-pvrusb2-24xxx-01.fw",
  "v4l-pvrusb2-29xxx-01.fw",
]

[[package]]
name = "iwlwifi"
desc = "Intel Wireless cards"
longdesc = "Intel Wireless cards supported by the iwl3945, iwl4965, and iwlwifi drivers"
files = [
  "iwlwifi-*",
  "intel/ibt-*",
  "intel/iwlwifi/*",
]

[[package]]
name = "libertas"
desc = "Marvell wireless cards"
longdesc = "wireless network cards with Marvell and NXP 88W8xxx chips supported by the libertas_cs, libertas_sdio, libertas_spi, libertas_tf_usb, mwifiex_pcie, mwifiex_sdio, mwifiex_usb, mwl8k and usb8xxx drivers"
recommends = [
  "firmware-marvell-prestera",
]
replaces = [
  "libertas-firmware",
]
provides = [
  "libertas-firmware",
]
files = [
  "lbtf_usb.bin",
  "libertas_cs*",
  "sd8385*.bin",
  "sd8686*.bin",
  "sd8688*.bin",
  "usb8388.bin",
  "libertas/*",
  "mrvl/*",
  "mwl8k/*",
]
files_excluded = [
  "mrvl/cpt*/*",
  "mrvl/prestera/*",
]

[[package]]
name = "marvell-prestera"
desc = "Marvell Prestera ASIC devices"
longdesc = "Marvell Switchdev solution Prestera Ethernet switches"
conflicts = [
  "firmware-libertas (<< 20230625-3~)",
]
files = [
  "mrvl/prestera/*",
]

[[package]]
name = "mediatek"
desc = "MediaTek and Ralink chips for networking, SoCs and media"
longdesc = "MediaTek devices such as ethernet/Wi-Fi/Bluetooth chips, SoCs and other chips and devices made by MediaTek and Ralink"
