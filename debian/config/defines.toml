  "powervr/*",
  "r8a779x_usb3_v1.dlmem",
  "r8a779x_usb3_v3.dlmem",
  "rp2.fw",
  "s2250.fw",
  "s2250_loader.fw",
  "TXNW*",
  "v4l-cx*",
  "vntwusb.fw",
