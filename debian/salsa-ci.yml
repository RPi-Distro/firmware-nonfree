include:
  - https://salsa.debian.org/salsa-ci-team/pipeline/raw/master/salsa-ci.yml

variables:
  RELEASE: 'unstable'
  # We only build arch:all packages
  SALSA_CI_DISABLE_BLHC: 'true'
  SALSA_CI_DISABLE_BUILD_PACKAGE_I386: 'true'
  SALSA_CI_DISABLE_BUILD_PACKAGE_ANY: 'true'
  # We don't compile anything
  SALSA_CI_DISABLE_CCACHE: 'true'
  SALSA_CI_DISABLE_CROSSBUILD_ARM64: 'true'
  # We have to bump the version in source preparation, not later
  SALSA_CI_DISABLE_VERSION_BUMP: 'true'

orig:
  stage: provisioning
  image: $SALSA_CI_IMAGES_BASE
  cache:
    key: "orig-${RELEASE}"
    paths:
      - orig
  extends:
    - .artifacts-default-expire
  except:
    variables:
      - $CI_COMMIT_TAG != null
  script:
    # Move orig tarball cache
    - |
      if [ -d orig ]; then
          mv orig/* ..
          rmdir orig
      fi

    - apt-get update
    - eatmydata apt-get install --no-install-recommends -y devscripts git
    - USCAN_VCS_EXPORT_UNCOMPRESSED=yes origtargz -dt

    # Move orig tarballs back to where GitLab wants them
    - mkdir orig
    - mv ../*.orig.tar.* orig

.local-build-script-extract-source: &local-build-script-extract-source
  # Move orig tarball cache
  - |
    if [ -d orig ]; then
        mv orig/* ${BUILD_DIR}/
        rmdir orig
    fi

  # Install dependencies of gencontrol.py and debian/rules orig
  - apt-get update
  - |
    eatmydata apt-get install --no-install-recommends -y \
      debhelper \
      python3 \
      python3-dacite \
      python3-jinja2 \
      quilt \
      rdfind \
      rsync

  - version=$(dpkg-parsechangelog -SVersion)
  - upstream_version=$(echo $version | sed 's/-[^-]*$//')

  # Export source to build directory
  - |
    git archive --format=tar --prefix=${source}-${upstream_version}/ HEAD \
      | tar -C ${BUILD_DIR} -x
  - cd ${BUILD_DIR}/${source}-${upstream_version}

  # Merge upstream source
  - debian/rules orig

  # Fudge source version and suite *before* gencontrol.py
  - sed -i -e '1 s/) [^;]*/+salsaci) UNRELEASED/' debian/changelog
  - version=${version}+salsaci

  # Run gencontrol.py
  # - create temporary log
  - log="$(mktemp)"
  # - invoke debian/control-real rule and log output
  - |
    rc=0; debian/rules debian/control-real >"$log" 2>&1 || rc=$?
  - cat "$log"
  # - check for success message and error code
  - test $rc = 2
  - grep -q 'been generated SUCCESSFULLY' "$log"

  # Build source package
  - dpkg-buildpackage -uc -us -S -sa -d

build:
  cache:
    key: "orig-${RELEASE}"
    paths:
      - orig
    policy: pull
  artifacts:
    paths:
      - ${WORKING_DIR}/
      - salsa.env
    exclude:
      - ${WORKING_DIR}/*.dsc
      - ${WORKING_DIR}/*.tar.*
      - ${WORKING_DIR}/*_source.*
  needs:
    - job: orig
  extends:
    - .build-definition
  except:
    variables:
      - $CI_COMMIT_TAG != null
  script:
    # Do the same as the common .build-definition script
    - !reference [.build-before-script]
    - !reference [.build-script-setup-environment]

    - *local-build-script-extract-source

    # Make everything accessible to build user
    - chown -R 'salsa-ci:' ${BUILD_DIR} ${WORKING_DIR}

    - !reference [.build-script-setup-build-command]
    - !reference [.build-script-run-build-command]

build source:
  cache:
    key: "orig-${RELEASE}"
    paths:
      - orig
    policy: pull
  needs:
    - job: orig
  extends:
    - .build-definition
  except:
    variables:
      - $CI_COMMIT_TAG != null
  script:
    - mkdir -p ${BUILD_DIR}
    - *local-build-script-extract-source
    - mkdir -p ${WORKING_DIR}
    - mv ../firmware-nonfree_${upstream_version}.orig.tar.xz ../firmware-nonfree_${version}.dsc ../firmware-nonfree_${version}.debian.tar.xz ../firmware-nonfree_${version}_source.buildinfo ../firmware-nonfree_${version}_source.changes ${WORKING_DIR}

# The folllowing jobs are the standard tests, excluding:
# - any that require building again
# - blhc, since we don't compile anything

lintian:
    extends: .test-lintian
    needs:
    - !reference [.test-lintian,needs]
    - job: build source
      artifacts: true

piuparts:
    # Currently disabled due to salsa-ci-team/pipeline#552
    rules:
      - when: never
    extends: .test-piuparts
    variables:
      # Skip the EULA questions in these two packages
      FIRMWARE_IPW2X00_LICENSE_READ_AND_ACCEPTED: 'yes'
      FIRMWARE_IVTV_LICENSE_READ_AND_ACCEPTED: 'yes'

missing-breaks:
    extends: .test-missing-breaks

rc-bugs:
    extends: .test-rc-bugs
