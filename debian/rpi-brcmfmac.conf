# Workarounds for unreliable onboard Wi-Fi (connections that drop or fail to
# come back, and firmware crashes). See raspberrypi/linux#6049 and
# RPi-Distro/firmware-nonfree#43.
#
# roamoff=1
#   Stop the Wi-Fi chip's firmware from deciding by itself when to switch to
#   another access point. Roaming is left to wpa_supplicant instead. Firmware
#   roaming was reported to cause firmware crashes and failed roams.
#
# feature_disable=0x282000 turns off three driver features:
#   0x002000 FWSUP      The firmware performing the WPA2 key handshake itself.
#   0x080000 SAE        The firmware performing WPA3 (SAE) authentication itself.
#                       With both off, wpa_supplicant does the handshake.
#                       Reported to fix failures to connect to WPA2/WPA3
#                       mixed-mode networks and to reconnect after the access
#                       point restarts.
#   0x200000 DUMP_OBSS  Asking the firmware for a survey of other networks on
#                       each channel. The request fails and fills the kernel
#                       log with "brcmf_set_channel: set chanspec fail,
#                       reason -52".
#
# These do not disable WPA3 itself, only the firmware's handling of it.
options brcmfmac roamoff=1 feature_disable=0x282000
